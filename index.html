<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827">

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--ink:#101827;--mint:#9cf2d0;--pink:#ff688e;--yellow:#ffd66b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:white;font-family:'DM Sans',sans-serif}body{touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,18,31,.16),transparent 35%,rgba(9,15,25,.38)),radial-gradient(ellipse at center,transparent 46%,rgba(5,10,19,.48))}.hud{position:fixed;top:22px;left:24px;right:24px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;opacity:0;transition:opacity .35s}.hud.show{opacity:1}.brand{font:900 23px 'Barlow Condensed',sans-serif;letter-spacing:2px}.brand span{color:var(--mint)}.scorebox{position:absolute;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 14px #101827}.scorebox small{display:block;color:#c7d4e3;font-size:10px;font-weight:800;letter-spacing:2.4px}.scorebox strong{font:800 34px 'Barlow Condensed',sans-serif;letter-spacing:1px}.stats{display:flex;gap:9px}.pill{display:flex;gap:7px;align-items:center;border:1px solid #ffffff30;border-radius:30px;background:#152234b8;padding:8px 13px;font-weight:800;font-size:13px;backdrop-filter:blur(10px)}.coinicon{color:var(--yellow)}button{font:800 13px 'DM Sans',sans-serif;color:white;cursor:pointer;border:0}.pause{pointer-events:auto;border:1px solid #ffffff35;background:#152234cc;width:39px;height:39px;border-radius:50%;margin-left:3px;font-size:14px}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#1018276b,#1018271f,#10182770);transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(450px,calc(100vw - 36px));text-align:center;padding:34px 34px 30px;border:1px solid #ffffff35;border-radius:25px;background:linear-gradient(145deg,#18263bd9,#111b2bd9);box-shadow:0 25px 90px #050a14a8;backdrop-filter:blur(15px);animation:float 4s ease-in-out infinite}.eyebrow{color:var(--mint);font-size:10px;letter-spacing:3px;font-weight:900}.title{font:900 clamp(60px,13vw,91px)/.83 'Barlow Condensed',sans-serif;letter-spacing:-1px;margin:13px 0 14px;text-shadow:0 5px 25px #55dbb54a}.title span{color:var(--mint)}.subtitle{color:#c2cede;font-size:14px;line-height:1.65;margin:0 auto 23px;max-width:310px}.primary{width:100%;padding:15px;border-radius:13px;color:#12212a;background:var(--mint);box-shadow:0 7px 20px #65e0b344;letter-spacing:1px;transition:transform .15s,filter .15s}.primary:hover{transform:translateY(-2px);filter:brightness(1.08)}.keys{display:flex;justify-content:center;gap:14px;margin-top:19px;color:#aab9ca;font-size:10px;font-weight:700}.keys span{white-space:nowrap}.key{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border:1px solid #ffffff30;border-radius:5px;color:#f3f7fb;margin-right:4px}.rule{height:1px;background:#ffffff18;margin:22px 0 15px}.bottom{font-size:10px;color:#8292a8;letter-spacing:.3px}.result{display:none;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 20px}.result div{background:#ffffff0c;border:1px solid #ffffff14;border-radius:12px;padding:12px}.result small{display:block;font-size:9px;letter-spacing:1.6px;color:#99a9bc;font-weight:800}.result b{display:block;font:800 27px 'Barlow Condensed',sans-serif;margin-top:2px}.result b.gold{color:var(--yellow)}.card.gameover .result{display:grid}.card.gameover .subtitle{margin-bottom:8px}@keyframes float{50%{transform:translateY(-5px)}}@media(max-width:600px){.hud{top:14px;left:14px;right:14px}.brand{font-size:18px}.pill{padding:7px 10px}.stats{gap:5px}.scorebox{top:48px}.card{padding:30px 24px}.keys{gap:8px}.keys span{font-size:9px}}
</style>
</head>
<body><canvas id="game"></canvas><div class="vignette"></div>
<div class="hud" id="hud"><div class="brand">NEON<span>RUN</span></div><div class="scorebox"><small>DISTANCE</small><strong id="score">000000</strong></div><div class="stats"><div class="pill"><span class="coinicon">●</span><span id="coins">0</span></div><button class="pause" id="pauseBtn" aria-label="Pause">Ⅱ</button></div></div>
<div class="overlay" id="overlay"><section class="card" id="card"><div class="eyebrow" id="eyebrow">CITY EXPRESS · ENDLESS RUNNER</div><h1 class="title" id="title">NEON<br><span>RUN</span></h1><p class="subtitle" id="subtitle">The city never sleeps. Pick a lane, catch the light, and see how far you can go.</p><div class="result"><div><small>FINAL SCORE</small><b id="finalScore">0</b></div><div><small>COINS COLLECTED</small><b class="gold" id="finalCoins">0</b></div><div><small>BEST RUN</small><b id="bestScore">0</b></div><div><small>BEST COINS</small><b class="gold" id="bestCoins">0</b></div></div><button class="primary" id="action">START RUN</button><div class="keys" id="keys"><span><i class="key">←</i><i class="key">→</i> SWITCH</span><span><i class="key">↑</i> JUMP</span><span><i class="key">↓</i> SLIDE</span></div><div class="rule"></div><div class="bottom" id="bottom">A / D to switch · W / SPACE to jump · S to slide</div></section></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false}),hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),card=document.querySelector('#card'),action=document.querySelector('#action');
let W=0,H=0,DPR=1, state='menu',last=0,time=0,distance=0,coins=0,speed=.27,player={lane:0,x:0,jump:0,slide:0,anim:0},objects=[],particles=[],spawn=0,shake=0,flash=0,best=+(localStorage.getItem('neonBest')||0),bestCoins=+(localStorage.getItem('neonBestCoins')||0),touch=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),road={horizon:.27,bottom:.94};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function proj(z,lane=0){let p=clamp(1-z,0,1.3),y=H*(road.horizon+Math.pow(p,1.6)*(road.bottom-road.horizon)),w=lerp(W*.075,W*.88,p),center=W*.5+Math.sin(time*.00018)*W*.012*(1-p);return{x:center+lane*w*.31,y,w,scale:lerp(.12,1.35,p),p}}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14243c');g.addColorStop(.5,'#355b72');g.addColorStop(1,'#e49a78');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let sx=W*.75,sy=H*.19;let glow=ctx.createRadialGradient(sx,sy,1,sx,sy,H*.3);glow.addColorStop(0,'#ffd99b80');glow.addColorStop(1,'#ffc88900');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.62);ctx.fillStyle='#ffe6bb';ctx.beginPath();ctx.arc(sx,sy,Math.min(W,H)*.035,0,Math.PI*2);ctx.fill();
// layered skyline
for(let layer=0;layer<3;layer++){let base=H*(.43+layer*.08),bw=W/(12+layer*3),offset=(time*(.000008+layer*.000014)*speed*70)%bw;for(let i=-1;i<Math.ceil(W/bw)+1;i++){let x=i*bw-offset,h=(.08+((i*37%11+11)%11)/100)*H*(1+layer*.35);ctx.fillStyle=['#24374c','#1c3044','#172b3d'][layer];ctx.fillRect(x,base-h,bw-3,h+H*.25);if(layer>0){ctx.fillStyle=layer===1?'#f8c47a44':'#b5e9ce2c';for(let yy=base-h+8;yy<base-3;yy+=13)for(let xx=x+6;xx<x+bw-5;xx+=11)if(((xx+yy+i*7)|0)%3!==0)ctx.fillRect(xx,yy,3,5)}}}
// atmospheric clouds
ctx.fillStyle='#ffe1cc14';for(let i=0;i<5;i++){let x=((i*W*.28-time*.003*speed)%(W*1.35)+W*1.35)%(W*1.35)-W*.15;ctx.beginPath();ctx.ellipse(x,H*(.15+i*.045),W*.09,H*.012,0,0,6.28);ctx.fill()}}
function drawRoad(){let hy=H*road.horizon,by=H*road.bottom,cx=W*.5+Math.sin(time*.00018)*W*.012;ctx.fillStyle='#283440';ctx.beginPath();ctx.moveTo(cx-W*.07,hy);ctx.lineTo(cx+W*.07,hy);ctx.lineTo(cx+W*.46,by);ctx.lineTo(cx-W*.46,by);ctx.closePath();ctx.fill();let rg=ctx.createLinearGradient(0,hy,0,by);rg.addColorStop(0,'#49535a');rg.addColorStop(.55,'#313b43');rg.addColorStop(1,'#202a33');ctx.fillStyle=rg;ctx.fill();
// road edge rails / lights
for(let side of [-1,1]){ctx.strokeStyle='#b3c5c333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+side*W*.075,hy);ctx.lineTo(cx+side*W*.46,by);ctx.stroke();ctx.strokeStyle='#e5b87c88';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx+side*W*.085,hy);ctx.lineTo(cx+side*W*.475,by);ctx.stroke()}
// track sleepers and animated ground strips
const phase=(distance*.08)%1;for(let i=0;i<18;i++){let q=(i/18+phase/18)%1,p=q*q,y=lerp(hy,by,p),width=lerp(W*.08,W*.86,p),th=lerp(1,13,p);ctx.fillStyle=i%2?'#a8b5b51c':'#d0b48a24';ctx.fillRect(cx-width/2,y,width,th)}
// rails: perspective strokes
for(let lane=-1;lane<=1;lane++){let x1=cx+lane*W*.024,x2=cx+lane*W*.135;ctx.strokeStyle=lane===0?'#a6afb299':'#a6afb266';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,hy);ctx.lineTo(x2,by);ctx.stroke();ctx.strokeStyle='#f5dcab66';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1-2,hy);ctx.lineTo(x2-7,by);ctx.stroke()}
// lane separators dashed in perspective
for(let lane of [-.5,.5]){for(let i=0;i<7;i++){let q=(i/7+phase/7)%1,p=q*q,y=lerp(hy,by,p),width=lerp(1,4,p),x=cx+lane*lerp(W*.08,W*.86,p);ctx.fillStyle='#e2d9b866';ctx.fillRect(x-width/2,y,width,lerp(2,18,p))}}
// trackside lamps and receding poles
for(let side of [-1,1])for(let i=0;i<6;i++){let q=(i/6+phase/6)%1,p=q*q,y=lerp(hy,by,p),edge=lerp(W*.08,W*.46,p),scale=lerp(.1,1,p),x=cx+side*(edge+W*.035*scale);ctx.strokeStyle='#293542';ctx.lineWidth=2.5*scale;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-H*.1*scale);ctx.lineTo(x-side*W*.025*scale,y-H*.1*scale);ctx.stroke();ctx.fillStyle='#f8d995';ctx.shadowColor='#ffe0a0';ctx.shadowBlur=12*scale;ctx.beginPath();ctx.arc(x-side*W*.025*scale,y-H*.1*scale,2.5*scale,0,6.28);ctx.fill();ctx.shadowBlur=0}
}
function spawnGroup(){let lane=Math.floor(rand(0,3))-1,typeRoll=Math.random();let type=typeRoll<.3?'barrier':typeRoll<.55?'train':typeRoll<.78?'overhead':'cone';objects.push({kind:type,lane,z:1.12,hit:false,seed:Math.random()});if(Math.random()<.8){let coinLane=Math.random()<.5?lane:Math.floor(rand(0,3))-1;for(let i=0;i<5;i++)objects.push({kind:'coin',lane:coinLane,z:1.15+i*.07,hit:false,seed:Math.random()})}}
function drawObject(o){let q=proj(o.z,o.lane),s=q.scale,x=q.x,y=q.y;ctx.save();if(o.kind==='coin'){if(o.hit)return;let spin=Math.abs(Math.cos(time*.008+o.seed*8));let r=12*s,ww=Math.max(2,r*(.25+.75*spin));ctx.fillStyle='#f6a92e';ctx.beginPath();ctx.ellipse(x,y-r*1.2,ww,r,0,0,6.28);ctx.fill();ctx.strokeStyle='#ffe584';ctx.lineWidth=2*s;ctx.stroke();ctx.fillStyle='#fff0a5';ctx.beginPath();ctx.ellipse(x,y-r*1.2,ww*.32,r*.48,0,0,6.28);ctx.fill();ctx.restore();return}
// soft contact shadow
ctx.fillStyle='#0b111b55';ctx.beginPath();ctx.ellipse(x,y+3*s,27*s,7*s,0,0,6.28);ctx.fill();
if(o.kind==='barrier'){let w=55*s,h=37*s;ctx.fillStyle='#c33c50';rounded(x-w/2,y-h,w,h,5*s);ctx.fillStyle='#f5c46e';ctx.fillRect(x-w/2,y-h*.7,w,h*.18);ctx.fillStyle='#f3e4c8';for(let k=0;k<3;k++){ctx.save();ctx.translate(x-w*.3+k*w*.3,y-h*.61);ctx.rotate(-.5);ctx.fillRect(-2*s,-4*s,5*s,12*s);ctx.restore()}}
else if(o.kind==='cone'){ctx.fillStyle='#f08a45';ctx.beginPath();ctx.moveTo(x,y-34*s);ctx.lineTo(x+22*s,y);ctx.lineTo(x-22*s,y);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe3a3';ctx.fillRect(x-12*s,y-12*s,24*s,4*s)}
else if(o.kind==='overhead'){ctx.fillStyle='#75889a';ctx.fillRect(x-37*s,y-79*s,74*s,13*s);ctx.fillRect(x-34*s,y-68*s,8*s,68*s);ctx.fillRect(x+26*s,y-68*s,8*s,68*s);ctx.fillStyle='#ffb55d';ctx.fillRect(x-28*s,y-76*s,13*s,6*s);ctx.fillRect(x+15*s,y-76*s,13*s,6*s)}
else {let w=90*s,h=90*s;ctx.fillStyle='#273d50';rounded(x-w/2,y-h,w,h,8*s);let grad=ctx.createLinearGradient(x-w/2,y-h,x+w/2,y);grad.addColorStop(0,'#d26953');grad.addColorStop(.5,'#eba56e');grad.addColorStop(1,'#bc5c51');ctx.fillStyle=grad;rounded(x-w/2+3*s,y-h+3*s,w-6*s,h-3*s,7*s);ctx.fillStyle='#183047';for(let k=0;k<3;k++){rounded(x-w*.38+k*w*.3,y-h*.74,w*.22,h*.35,3*s);ctx.fillStyle='#8fced0';ctx.fill();ctx.fillStyle='#183047'}ctx.fillStyle='#ffdc9c';ctx.fillRect(x-w*.43,y-8*s,w*.12,5*s);ctx.fillRect(x+w*.31,y-8*s,w*.12,5*s);ctx.fillStyle='#151d26';for(let k of [-1,1]){ctx.beginPath();ctx.arc(x+k*w*.32,y-2*s,10*s,0,6.28);ctx.fill();ctx.fillStyle='#9ca7ad';ctx.beginPath();ctx.arc(x+k*w*.32,y-2*s,5*s,0,6.28);ctx.fill();ctx.fillStyle='#151d26'}}ctx.restore()}
function drawPlayer(){let baseY=H*.87,px=W*.5+player.x*W*.14,j=player.jump,sl=player.slide,scale=Math.min(W/900,1.15);baseY-=j*H*.21;let run=Math.sin(player.anim*12),leg=run*10*scale*(1-sl),arm=-run*11*scale;ctx.save();ctx.translate(px,baseY);ctx.scale(scale,scale);ctx.fillStyle='#10192366';ctx.beginPath();ctx.ellipse(0,5+j*16,25*(1-j*.3),7*(1-j*.4),0,0,6.28);ctx.fill();ctx.translate(0,sl*20);ctx.rotate(-sl*.1);
// legs / bright sneakers
ctx.strokeStyle='#19283a';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7, -30);ctx.lineTo(-11+leg,-7);ctx.lineTo(-15+leg,-1);ctx.moveTo(7,-30);ctx.lineTo(12-leg,-8);ctx.lineTo(15-leg,0);ctx.stroke();ctx.fillStyle='#e9f1ea';rounded(-22+leg,-5,18,7,3);rounded(7-leg,-5,18,7,3);
// jacket torso
ctx.fillStyle='#32c7a4';ctx.beginPath();ctx.moveTo(-14,-65);ctx.quadraticCurveTo(-19,-48,-13,-31);ctx.lineTo(13,-31);ctx.quadraticCurveTo(19,-48,14,-65);ctx.closePath();ctx.fill();ctx.fillStyle='#f3c66e';ctx.fillRect(-2,-62,4,25);
// arms swinging
ctx.strokeStyle='#e6a876';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-12,-59);ctx.lineTo(-20+arm,-43);ctx.lineTo(-18+arm,-34);ctx.moveTo(12,-59);ctx.lineTo(20-arm,-44);ctx.lineTo(17-arm,-35);ctx.stroke();
// head, hair and cap
ctx.fillStyle='#d9956d';ctx.beginPath();ctx.arc(0,-75,13,0,6.28);ctx.fill();ctx.fillStyle='#282637';ctx.beginPath();ctx.arc(0,-81,13,Math.PI,Math.PI*2);ctx.lineTo(13,-77);ctx.quadraticCurveTo(0,-88,-13,-77);ctx.fill();ctx.fillStyle='#ff7187';ctx.fillRect(-13,-76,26,4);ctx.restore()}
function burst(x,y,color,n=9){for(let i=0;i<n;i++){let a=Math.random()*6.28,v=rand(30,120);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-35,life:rand(.35,.75),max:.75,color,r:rand(2,5)})}}
function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}ctx.globalAlpha=1}
function update(dt){if(state!=='playing')return;time+=dt*1000;distance+=speed*dt*170;speed=Math.min(.53,.27+distance/13500);player.anim+=dt*(7+speed*8);player.x=lerp(player.x,player.lane,.18);player.jump=Math.max(0,player.jump-dt*1.4);player.slide=Math.max(0,player.slide-dt*1.2);spawn-=dt;if(spawn<=0){spawnGroup();spawn=rand(.85,1.22)*(0.31/speed)}for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.z-=speed*dt;if(o.kind==='coin'&&o.z<.08&&o.z>-.025&&!o.hit&&o.lane===player.lane){o.hit=true;coins++;burst(W*.5+player.x*W*.14,H*.74,'#ffd66b',8)}if(o.kind!=='coin'&&!o.hit&&o.z<.085&&o.z>-.03&&o.lane===player.lane){let safe=o.kind==='barrier'||o.kind==='cone'?player.jump>.48:o.kind==='overhead'?player.slide>.42:false;if(!safe){o.hit=true;state='over';shake=.45;flash=.4;burst(W*.5+player.x*W*.14,H*.79,'#ff688e',18);gameOver();break}else o.hit=true}if(o.z<-.12)objects.splice(i,1)}shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);document.querySelector('#score').textContent=String(Math.floor(distance)).padStart(6,'0');document.querySelector('#coins').textContent=coins}
function render(dt){time+=dt*1000;ctx.save();if(shake)ctx.translate(rand(-1,1)*shake*20,rand(-1,1)*shake*15);sky();drawRoad();objects.sort((a,b)=>b.z-a.z);for(const o of objects)drawObject(o);drawPlayer();drawParticles(dt);if(flash){ctx.fillStyle=`rgba(255,70,100,${flash*.4})`;ctx.fillRect(0,0,W,H)}ctx.restore()}
function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;if(state==='playing')update(dt);render(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function start(){state='playing';distance=0;coins=0;speed=.27;player={lane:0,x:0,jump:0,slide:0,anim:0};objects=[];particles=[];spawn=.7;hud.classList.add('show');overlay.classList.add('hidden');card.classList.remove('gameover');document.querySelector('#score').textContent='000000';document.querySelector('#coins').textContent='0'}
function showMenu(mode){overlay.classList.remove('hidden');if(mode==='pause'){state='paused';document.querySelector('#eyebrow').textContent='TAKE A BREATHER';document.querySelector('#title').innerHTML='RUN<br><span>PAUSED</span>';document.querySelector('#subtitle').textContent='The tracks will be right here when you’re ready.';action.textContent='RESUME RUN';document.querySelector('#keys').style.display='none';document.querySelector('#bottom').textContent='Your run is waiting.';card.classList.remove('gameover')}else{state='menu';hud.classList.remove('show');document.querySelector('#eyebrow').textContent='CITY EXPRESS · ENDLESS RUNNER';document.querySelector('#title').innerHTML='NEON<br><span>RUN</span>';document.querySelector('#subtitle').textContent='The city never sleeps. Pick a lane, catch the light, and see how far you can go.';action.textContent='START RUN';document.querySelector('#keys').style.display='flex';document.querySelector('#bottom').textContent='A / D to switch · W / SPACE to jump · S to slide';card.classList.remove('gameover')}}
function gameOver(){best=Math.max(best,Math.floor(distance));bestCoins=Math.max(bestCoins,coins);localStorage.setItem('neonBest',best);localStorage.setItem('neonBestCoins',bestCoins);document.querySelector('#eyebrow').textContent='THE CITY KEEPS MOVING';document.querySelector('#title').innerHTML='RUN<br><span>OVER</span>';document.querySelector('#subtitle').textContent='One more run? You were getting into a rhythm.';document.querySelector('#finalScore').textContent=Math.floor(distance).toLocaleString();document.querySelector('#finalCoins').textContent=coins;document.querySelector('#bestScore').textContent=best.toLocaleString();document.querySelector('#bestCoins').textContent=bestCoins;action.textContent='RUN IT BACK';document.querySelector('#keys').style.display='none';document.querySelector('#bottom').textContent='Tap, click, or press enter to try again.';card.classList.add('gameover');setTimeout(()=>overlay.classList.remove('hidden'),360)}
function move(dir){if(state!=='playing')return;player.lane=clamp(player.lane+dir,-1,1)}function jump(){if(state==='playing'&&player.jump===0&&player.slide===0)player.jump=1}function slide(){if(state==='playing'&&player.slide===0)player.slide=1}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'){if(state==='playing')showMenu('pause');else if(state==='paused')showMenu('resume')}if(state==='menu'&&['Enter',' '].includes(e.key)){start();return}if(state==='over'&&['Enter',' '].includes(e.key)){start();return}if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(['ArrowUp','w','W',' '].includes(e.key))jump();if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')slide()});
action.addEventListener('click',()=>{if(state==='paused')resume();else start()});document.querySelector('#pauseBtn').addEventListener('click',()=>showMenu('pause'));function resume(){state='playing';overlay.classList.add('hidden');document.querySelector('#keys').style.display='flex'}
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{if(!touch)return;let dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24){if(Math.abs(dx)>Math.abs(dy))move(dx<0?-1:1);else if(dy<0)jump();else slide()}touch=null});
// overlay clicks and keyboard resume
overlay.addEventListener('click',e=>{if(e.target===overlay&&state==='paused')resume()});
})();
</script></body></html>
